<!doctype html>
<meta charset="utf-8">
<title>Archive Scan Slides</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=block">
<style>
  body { margin: 0; background: #111; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  canvas { width: 432px; height: 540px; }
</style>
<body>
<script>
// Archive-scan carousel: prints and a typed paper label laid on an open-lid flatbed scanner.
const W = 1080, H = 1350, R = 2;

let seed = 3;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });

const SLIDES = [
  {
    prints: [{ src: 'photos/dior-montaigne.webp', x: 118, y: 300, w: 820, rot: -0.8 }],
    label: { x: 108, y: 1010, w: 480, rot: 0.25, lines: ['CHRISTIAN DIOR AT HIS COUTURE HOUSE', '30 AVENUE MONTAIGNE, PARIS', '1950s'] },
  },
  {
    prints: [
      { src: 'photos/gallery-1.jpg', x: 70, y: 318, w: 468, rot: 0.9 },
      { src: 'photos/gallery-2.jpg', x: 560, y: 412, w: 460, rot: -1.1 },
    ],
    label: { x: 82, y: 860, w: 500, rot: -0.3, lines: ['EXPOSITION SURRÉALISTE', 'GALERIE PIERRE COLLE, PARIS', '1933'] },
  },
];

// ---- scanner bed: near-black, uneven, with grain, dust and a hair or two
function scannerBed(g) {
  g.fillStyle = '#070707'; g.fillRect(0, 0, W, H);
  const v = g.createRadialGradient(W * 0.45, H * 0.42, 50, W * 0.45, H * 0.45, H * 0.8);
  v.addColorStop(0, 'rgba(34,34,32,0.9)'); v.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  // faint light leak along the lid edge
  const e = g.createLinearGradient(0, 0, 0, 140);
  e.addColorStop(0, 'rgba(60,60,58,0.35)'); e.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = e; g.fillRect(0, 0, W, 140);
  for (let i = 0; i < 260; i++) {
    g.fillStyle = `rgba(255,255,255,${0.04 + rnd() * 0.18})`;
    const s = rnd() < 0.9 ? 0.8 + rnd() * 1.2 : 2 + rnd() * 2.5;
    g.beginPath(); g.arc(rnd() * W, rnd() * H, s / 2, 0, Math.PI * 2); g.fill();
  }
  for (let i = 0; i < 3; i++) {
    g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 0.7;
    let x = rnd() * W, y = rnd() * H;
    g.beginPath(); g.moveTo(x, y);
    g.bezierCurveTo(x + (rnd() - .5) * 90, y + (rnd() - .5) * 90, x + (rnd() - .5) * 120, y + (rnd() - .5) * 120, x + (rnd() - .5) * 140, y + (rnd() - .5) * 140);
    g.stroke();
  }
}

// a slightly irregular rectangle, like a hand-trimmed print
function roughRect(g, w, h, j) {
  const pts = [];
  const side = (x0, y0, x1, y1, n) => { for (let i = 0; i < n; i++) { const u = i / n; pts.push([x0 + (x1 - x0) * u + (rnd() - .5) * j, y0 + (y1 - y0) * u + (rnd() - .5) * j]); } };
  side(0, 0, w, 0, 14); side(w, 0, w, h, 12); side(w, h, 0, h, 14); side(0, h, 0, 0, 12);
  g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
}

// ---- photographic print: lifted blacks, a warm silver-gelatin tone, grain, soft edge falloff
function print(g, img, p) {
  const w = p.w, h = w * img.height / img.width;
  const tmp = document.createElement('canvas'); tmp.width = Math.round(w * R); tmp.height = Math.round(h * R);
  const t = tmp.getContext('2d');
  t.filter = 'grayscale(1) contrast(0.88) brightness(1.06) sepia(0.18)';
  t.drawImage(img, 0, 0, tmp.width, tmp.height);
  t.filter = 'none';
  const d = t.getImageData(0, 0, tmp.width, tmp.height), a = d.data;
  for (let i = 0; i < a.length; i += 4) {
    const n = (rnd() - 0.5) * 26;
    for (let c = 0; c < 3; c++) a[i + c] = Math.min(255, 22 + a[i + c] * 0.9 + n);
  }
  t.putImageData(d, 0, 0);
  const vg = t.createRadialGradient(tmp.width / 2, tmp.height / 2, tmp.width * 0.2, tmp.width / 2, tmp.height / 2, tmp.width * 0.75);
  vg.addColorStop(0, 'rgba(255,255,255,0.05)'); vg.addColorStop(1, 'rgba(255,250,240,0.16)');
  t.fillStyle = vg; t.fillRect(0, 0, tmp.width, tmp.height);

  g.save();
  g.translate(p.x + w / 2, p.y + h / 2);
  g.rotate(p.rot * Math.PI / 180);
  g.translate(-w / 2, -h / 2);
  g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 10; g.shadowOffsetY = 2;
  roughRect(g, w, h, 1.6); g.fillStyle = '#d9d6cf'; g.fill();
  g.shadowColor = 'transparent';
  g.save(); roughRect(g, w, h, 1.6); g.clip();
  g.drawImage(tmp, 0, 0, w, h);
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 1; roughRect(g, w, h, 1.2); g.stroke();
  g.restore();
}

// ---- thin fibrous paper strip with typewritten caption
function label(g, L) {
  const lh = 22, h = 40 + lh * L.lines.length;
  g.save();
  g.translate(L.x, L.y);
  g.rotate(L.rot * Math.PI / 180);
  roughRect(g, L.w, h, 1.4);
  g.fillStyle = '#e4e2dc'; g.fill();
  g.save(); roughRect(g, L.w, h, 1.4); g.clip();
  for (let i = 0; i < 700; i++) {
    g.strokeStyle = rnd() < 0.5 ? `rgba(120,118,112,${0.08 + rnd() * 0.12})` : `rgba(255,255,255,${0.2 + rnd() * 0.3})`;
    g.lineWidth = 0.5 + rnd() * 0.6;
    const x = rnd() * L.w, y = rnd() * h, a = rnd() * 6.28, s = 4 + rnd() * 18;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * s * 0.5 + (rnd() - .5) * 6, y + Math.sin(a) * s * 0.5 + (rnd() - .5) * 6, x + Math.cos(a) * s, y + Math.sin(a) * s); g.stroke();
  }
  const sh = g.createLinearGradient(0, 0, L.w, h);
  sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.08)');
  g.fillStyle = sh; g.fillRect(0, 0, L.w, h);
  g.restore();
  g.font = '15px "Special Elite", "Courier New", monospace';
  g.textBaseline = 'alphabetic';
  try { g.letterSpacing = '1.2px'; } catch (e) {}
  L.lines.forEach((line, i) => {
    // typewriter ink: a darker strike plus a faint offset, each letter a little uneven
    let x = 26;
    const y = 32 + i * lh;
    for (const ch of line) {
      g.fillStyle = `rgba(28,28,28,${0.72 + rnd() * 0.25})`;
      g.fillText(ch, x, y + (rnd() - .5) * 0.6);
      g.fillStyle = 'rgba(28,28,28,0.18)';
      g.fillText(ch, x + 0.5, y + 0.4);
      x += g.measureText(ch).width + 1.2;
    }
  });
  g.restore();
}

async function render(slide, i) {
  seed = 3 + i * 101;
  const cv = document.createElement('canvas'); cv.width = W * R; cv.height = H * R;
  const g = cv.getContext('2d'); g.scale(R, R);
  scannerBed(g);
  for (const p of slide.prints) print(g, await load(p.src), p);
  label(g, slide.label);
  // a final pass of scanner noise over everything
  const d = g.getImageData(0, 0, cv.width, cv.height), a = d.data;
  for (let k = 0; k < a.length; k += 4) { const n = (rnd() - 0.5) * 7; a[k] += n; a[k + 1] += n; a[k + 2] += n; }
  g.putImageData(d, 0, 0);
  document.body.appendChild(cv);
  return cv.toDataURL('image/png');
}

window.renderAll = async () => {
  await document.fonts.load('15px "Special Elite"').catch(() => {});
  const out = [];
  for (let i = 0; i < SLIDES.length; i++) out.push(await render(SLIDES[i], i));
  return out;
};
</script>
</body>
