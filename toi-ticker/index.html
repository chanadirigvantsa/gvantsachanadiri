<title>TOI Ticker Reel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@1,800&display=block">
<style>
  /* Layout: one tall canvas; a red TOI. over thirteen ticker bands that run, slow down and lock into the poem */
  :root {
    --paper: #f4f2ee;
    --ink: #111111;
    --red: #d8261c;
    --font-ui: "Jost", "Futura", "Trebuchet MS", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  canvas { display: block; max-width: 100%; height: auto; width: min(100%, calc((100vh - 96px) * 0.5625)); background: var(--paper); }
  button {
    font: inherit; font-style: italic; font-weight: 800; font-size: 16px; letter-spacing: 0.04em;
    color: var(--ink); background: none; border: 0; padding: 6px 4px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  body.export button { display: none; }
  body.export { padding: 0; gap: 0; }
  body.export canvas { width: 1080px; }
</style>

<canvas id="c" width="1080" height="1920" aria-label="Red TOI. above lines of French text that scroll like a ticker and stop"></canvas>
<button id="replay" type="button">REJOUER</button>

<script>
(() => {
  const W = 1080, H = 1920;
  const R = Math.max(1, Math.min(3, +new URLSearchParams(location.search).get('res') || 1));
  const cv = document.getElementById('c');
  cv.width = W * R; cv.height = H * R;
  const ctx = cv.getContext('2d');
  const FONT = '"Jost", "Futura", "Trebuchet MS", sans-serif';
  const PAPER = '#f4f2ee', INK = '#111111', RED = '#d8261c';

  const LINES = [
    'TU ES LÀ.', 'TU REGARDES À TRAVERS LE MIROIR,', 'SOMBREMENT.', 'TU VOIS L’INVISIBLE,',
    'L’INSAISISSABLE,', 'LE PRESQUE INEXISTANT.', 'TOI, QUI QUE TU SOIS,', 'GRAVÉ DANS LA MÉMOIRE,',
    'JUSQU’À CE QUE TOI,', 'L’OBSERVATEUR,', 'TU DISPARAISSES.', 'PLUS RIEN.', 'TOI AUSSI.',
  ];
  const INVERT = new Set([1, 4, 7, 10]);   // some bands run white on black, like the stripes on the floor
  const TOP = 560, LH = 84, FS = 66, PADX = 54;
  const STOP0 = 4.2, STOP_STEP = 0.16;      // first band locks at 4.2 s, the rest follow
  const LOCKS = [6.6, 6.95, 7.3, 7.65];     // T, O, I, .

  let seed = 13;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const easeOut = t => 1 - Math.pow(1 - clamp(t), 4);

  const bands = LINES.map((text, i) => ({
    text, dir: i % 2 ? 1 : -1,
    dist: 5200 + rnd() * 2600,
    stop: STOP0 + i * STOP_STEP + rnd() * 0.12,
  }));
  window.TIMING = { stops: bands.map(b => b.stop), dists: bands.map(b => b.dist), locks: LOCKS };

  function setFont(px) {
    ctx.font = `italic 800 ${px}px ${FONT}`;
    try { ctx.letterSpacing = `${-px * 0.02}px`; } catch (e) {}
  }

  function drawBand(b, i, t) {
    const y = TOP + i * LH;
    const inv = INVERT.has(i);
    ctx.fillStyle = inv ? INK : PAPER;
    ctx.fillRect(0, y, W, LH);
    setFont(FS);
    let tw = ctx.measureText(b.text).width;
    const fit = Math.min(1, (W - PADX * 2) / tw);   // long lines shrink to fit the width
    if (fit < 1) { setFont(FS * fit); tw = ctx.measureText(b.text).width; }
    const unit = Math.max(tw + 120, W + 40);   // one copy plus a gap; neighbours fall off-screen once locked
    const off = b.dir * b.dist * (1 - easeOut(t / b.stop));
    let x = PADX + off;
    x = ((x - PADX) % unit + unit) % unit + PADX - unit;  // wrap so copies always cover the band
    ctx.fillStyle = inv ? PAPER : INK;
    ctx.textBaseline = 'alphabetic';
    ctx.save();
    ctx.beginPath(); ctx.rect(0, y, W, LH); ctx.clip();
    for (let cx = x - unit; cx < W + unit; cx += unit) ctx.fillText(b.text, cx, y + LH * 0.5 + FS * fit * 0.36);
    ctx.restore();
  }

  // TOI. on a slot-machine roll: each letter flicks through the alphabet, then locks
  const ROLL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  function drawToi(t) {
    const fs = 420, base = 480;
    setFont(fs);
    const final = ['T', 'O', 'I', '.'];
    const widths = final.map(c => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0);
    let x = (W - total) / 2 - 10;
    const appear = clamp((t - 0.3) / 0.4);
    if (appear <= 0) return;
    ctx.save();
    ctx.globalAlpha = appear;
    ctx.fillStyle = RED;
    final.forEach((ch, k) => {
      const lock = LOCKS[k];
      const box = { x: x - 8, y: base - fs * 0.78, w: widths[k] + 30, h: fs * 0.86 };
      ctx.save();
      ctx.beginPath(); ctx.rect(x - 4, box.y - 6, widths[k] + 4, box.h + 12); ctx.clip();
      if (t >= lock) {
        const settle = clamp((t - lock) / 0.18);
        ctx.fillText(ch, x, base + (1 - settle) * -26 * (1 - settle));
      } else {
        const rate = 14 + 10 * clamp((lock - t) / 3);   // flicks per second, slowing near the lock
        const step = Math.floor(t * rate + k * 7);
        const frac = t * rate + k * 7 - step;
        const c1 = ROLL[(step * 7 + k * 5) % ROLL.length], c2 = ROLL[((step + 1) * 7 + k * 5) % ROLL.length];
        // squeeze wide letters into this slot so the roll never spills into its neighbour
        const put = (c, yy) => { const cw = ctx.measureText(c).width, k2 = Math.min(1, widths[k] / cw); ctx.save(); ctx.translate(x + widths[k] / 2, yy); ctx.scale(k2, 1); ctx.fillText(c, -cw / 2, 0); ctx.restore(); };
        put(c1, base + frac * fs * 0.9);
        put(c2, base - (1 - frac) * fs * 0.9);
      }
      ctx.restore();
      x += widths[k];
    });
    ctx.restore();
  }

  function renderAt(t) {
    ctx.setTransform(R, 0, 0, R, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
    drawToi(t);
    // thin black rule between the title and the ticker
    ctx.fillStyle = INK; ctx.fillRect(PADX, TOP - 26, W - PADX * 2, 6);
    bands.forEach((b, i) => drawBand(b, i, t));
    ctx.fillRect(0, TOP + LINES.length * LH, W, 6);
  }
  window.renderAt = renderAt;

  const params = new URLSearchParams(location.search);
  const fontReady = Promise.race([document.fonts.load(`italic 800 66px "Jost"`).catch(() => {}), new Promise(r => setTimeout(r, 2500))]);
  renderAt(0);
  if (params.has('export')) { document.body.classList.add('export'); window.ready = fontReady.then(() => true); return; }
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let start = performance.now();
  function loop(now) { renderAt((now - start) / 1000); requestAnimationFrame(loop); }
  fontReady.then(() => { start = performance.now(); if (reduce) renderAt(12); else requestAnimationFrame(loop); });
  document.getElementById('replay').addEventListener('click', () => { start = performance.now(); if (reduce) renderAt(12); });
})();
</script>
