<!doctype html>
<meta charset="utf-8">
<title>Atelier Archive Slides</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=block">
<style>
  body { margin: 0; background: #888; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  canvas { width: 432px; height: 540px; }
</style>
<body>
<script>
// Atelier archive: prints pinned to Dior-grey card with pearl dressmaker's pins, captions on cream toile tags tied with cotton thread.
const W = 1080, H = 1350, R = 2;
const SERIF = '"Cormorant Garamond", Garamond, "Times New Roman", serif';

let seed = 9;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
const rad = d => d * Math.PI / 180;

const SLIDES = [
  {
    prints: [{ src: 'photos/dior-montaigne.webp', x: 150, y: 250, w: 780, rot: -1.2, pins: [[0.08, 0.04], [0.92, 0.035]] }],
    tag: { x: 610, y: 990, rot: 4, anchor: [905, 905], num: 'N° 1', lines: ['Christian Dior', 'at 30 avenue Montaigne, Paris', '1950s'] },
  },
  {
    prints: [
      { src: 'photos/gallery-1.jpg', x: 95, y: 255, w: 520, rot: -2, pins: [[0.5, 0.04]] },
      { src: 'photos/gallery-2.jpg', x: 465, y: 560, w: 525, rot: 1.6, pins: [[0.5, 0.04]] },
    ],
    tag: { x: 110, y: 1010, rot: -3, anchor: [400, 720], num: 'N° 2', lines: ['Exposition surréaliste', 'Galerie Pierre Colle, Paris', '1933'] },
  },
];

// ---- Dior grey card with a faint laid-paper texture and soft window light
function card(g) {
  g.fillStyle = '#d4d0ca'; g.fillRect(0, 0, W, H);
  const l = g.createRadialGradient(W * 0.3, H * 0.15, 80, W * 0.4, H * 0.4, H);
  l.addColorStop(0, 'rgba(255,255,252,0.35)'); l.addColorStop(1, 'rgba(120,114,108,0.28)');
  g.fillStyle = l; g.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 3) { g.fillStyle = `rgba(255,255,255,${0.025 + rnd() * 0.02})`; g.fillRect(0, y, W, 1); }
  for (let x = 0; x < W; x += 34 + rnd() * 6) { g.fillStyle = 'rgba(110,104,98,0.035)'; g.fillRect(x, 0, 1.2, H); }
  for (let i = 0; i < 1600; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(90,84,78,0.06)' : 'rgba(255,255,255,0.08)'; g.fillRect(rnd() * W, rnd() * H, 1.4, 1.4); }
}

function printCanvas(img, w, h) {
  const tmp = document.createElement('canvas'); tmp.width = Math.round(w * R); tmp.height = Math.round(h * R);
  const t = tmp.getContext('2d');
  t.filter = 'grayscale(1) contrast(1.02) brightness(1.02) sepia(0.12)';
  t.drawImage(img, 0, 0, tmp.width, tmp.height);
  t.filter = 'none';
  const d = t.getImageData(0, 0, tmp.width, tmp.height), a = d.data;
  for (let i = 0; i < a.length; i += 4) { const n = (rnd() - 0.5) * 14; for (let c = 0; c < 3; c++) a[i + c] = Math.min(255, 10 + a[i + c] * 0.95 + n); }
  t.putImageData(d, 0, 0);
  return tmp;
}

// a print with a cream border; returns where its pins sit in page space
function print(g, img, p) {
  const bw = 18, w = p.w, ih = (w - bw * 2) * img.height / img.width, h = ih + bw * 2;
  const pic = printCanvas(img, w - bw * 2, ih);
  g.save();
  g.translate(p.x + w / 2, p.y + h / 2);
  g.rotate(rad(p.rot));
  g.translate(-w / 2, -h / 2);
  // pinned only at the top, so the bottom lifts a little: deeper shadow lower down
  g.shadowColor = 'rgba(60,52,46,0.35)'; g.shadowBlur = 26; g.shadowOffsetX = 6; g.shadowOffsetY = 14;
  g.fillStyle = '#f4f1ea'; g.fillRect(0, 0, w, h);
  g.shadowColor = 'rgba(60,52,46,0.25)'; g.shadowBlur = 4; g.shadowOffsetX = 1; g.shadowOffsetY = 2;
  g.fillRect(0, 0, w, h);
  g.shadowColor = 'transparent';
  const sh = g.createLinearGradient(0, 0, 0, h);
  sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(120,110,100,0.10)');
  g.fillStyle = sh; g.fillRect(0, 0, w, h);
  g.drawImage(pic, bw, bw, w - bw * 2, ih);
  g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = 0.8; g.strokeRect(bw, bw, w - bw * 2, ih);
  g.restore();
  const c = Math.cos(rad(p.rot)), s = Math.sin(rad(p.rot));
  const at = ([u, v]) => { const lx = (u - 0.5) * w, ly = (v - 0.5) * h; return [p.x + w / 2 + lx * c - ly * s, p.y + h / 2 + lx * s + ly * c]; };
  return { pins: p.pins.map(at), at };
}

// pearl-headed dressmaker's pin: shaft runs down into the paper, head casts a shadow
function pin(g, [x, y], ang = 62) {
  const a = rad(ang), L = 46;
  const ex = x + Math.cos(a) * L, ey = y + Math.sin(a) * L;
  g.save();
  g.strokeStyle = 'rgba(50,44,40,0.28)'; g.lineWidth = 2.4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x + 7, y + 9); g.lineTo(ex + 3, ey + 3); g.stroke();
  g.fillStyle = 'rgba(50,44,40,0.25)'; g.filter = 'blur(3px)';
  g.beginPath(); g.arc(x + 8, y + 10, 10, 0, Math.PI * 2); g.fill();
  g.filter = 'none';
  const st = g.createLinearGradient(x, y, ex, ey);
  st.addColorStop(0, '#9a9a9c'); st.addColorStop(0.5, '#e8e8ea'); st.addColorStop(1, '#7c7c80');
  g.strokeStyle = st; g.lineWidth = 1.8;
  g.beginPath(); g.moveTo(x, y); g.lineTo(ex, ey); g.stroke();
  const hd = g.createRadialGradient(x - 3, y - 3, 1, x, y, 10);
  hd.addColorStop(0, '#ffffff'); hd.addColorStop(0.45, '#f1ece4'); hd.addColorStop(1, '#bdb4aa');
  g.fillStyle = hd;
  g.beginPath(); g.arc(x, y, 9, 0, Math.PI * 2); g.fill();
  g.restore();
}

// cream toile tag with a reinforced eyelet, tied to a pin with cotton thread
function tag(g, T, anchor) {
  const w = 360, h = 160, cut = 34;
  const holeL = [cut + 16, h / 2];
  const c = Math.cos(rad(T.rot)), s = Math.sin(rad(T.rot));
  const hx = T.x + holeL[0] * c - holeL[1] * s, hy = T.y + holeL[0] * s + holeL[1] * c;

  // thread: from the pin head, sagging down to the eyelet
  g.save();
  const mx = (anchor[0] + hx) / 2 + 30, my = Math.max(anchor[1], hy) + 60;
  g.strokeStyle = 'rgba(60,52,46,0.22)'; g.lineWidth = 2.6;
  g.beginPath(); g.moveTo(anchor[0] + 5, anchor[1] + 7); g.quadraticCurveTo(mx + 5, my + 7, hx + 5, hy + 7); g.stroke();
  g.strokeStyle = '#f7f3ea'; g.lineWidth = 1.7;
  g.beginPath(); g.moveTo(anchor[0], anchor[1]); g.quadraticCurveTo(mx, my, hx, hy); g.stroke();
  g.restore();

  g.save();
  g.translate(T.x, T.y);
  g.rotate(rad(T.rot));
  const shape = () => { g.beginPath(); g.moveTo(cut, 0); g.lineTo(w, 0); g.lineTo(w, h); g.lineTo(cut, h); g.lineTo(0, h - cut); g.lineTo(0, cut); g.closePath(); };
  g.shadowColor = 'rgba(60,52,46,0.3)'; g.shadowBlur = 14; g.shadowOffsetX = 3; g.shadowOffsetY = 7;
  shape(); g.fillStyle = '#efe7d6'; g.fill();
  g.shadowColor = 'transparent';
  g.save(); shape(); g.clip();
  for (let i = 0; i < 500; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(150,130,100,0.08)' : 'rgba(255,255,255,0.18)'; g.fillRect(rnd() * w, rnd() * h, 1.3, 1.3); }
  g.restore();
  // eyelet
  g.fillStyle = '#d8ccb4'; g.beginPath(); g.arc(holeL[0], holeL[1], 13, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#d4d0ca'; g.beginPath(); g.arc(holeL[0], holeL[1], 6, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(120,104,80,0.35)'; g.lineWidth = 1; g.beginPath(); g.arc(holeL[0], holeL[1], 13, 0, Math.PI * 2); g.stroke();
  // caption, set like a house archive card
  const tx = 92;
  g.fillStyle = '#3b332d';
  g.font = `600 15px ${SERIF}`;
  try { g.letterSpacing = '3px'; } catch (e) {}
  g.fillText(T.num.toUpperCase(), tx, 42);
  g.strokeStyle = 'rgba(59,51,45,0.4)'; g.lineWidth = 0.8;
  g.beginPath(); g.moveTo(tx, 54); g.lineTo(w - 28, 54); g.stroke();
  try { g.letterSpacing = '0.5px'; } catch (e) {}
  g.font = `600 27px ${SERIF}`;
  g.fillText(T.lines[0], tx, 88);
  g.font = `italic 500 19px ${SERIF}`;
  g.fillText(T.lines[1], tx, 114);
  g.font = `500 17px ${SERIF}`;
  try { g.letterSpacing = '2px'; } catch (e) {}
  g.fillText(T.lines[2], tx, 140);
  g.restore();
  pin(g, anchor);
}

async function render(slide, i) {
  seed = 9 + i * 77;
  const cv = document.createElement('canvas'); cv.width = W * R; cv.height = H * R;
  const g = cv.getContext('2d'); g.scale(R, R);
  card(g);
  const placed = [];
  for (const p of slide.prints) placed.push(print(g, await load(p.src), p));
  const anchor = slide.tag.anchor;
  tag(g, slide.tag, anchor);
  placed.forEach(pl => pl.pins.forEach(pt => { if (Math.hypot(pt[0] - anchor[0], pt[1] - anchor[1]) > 1) pin(g, pt); }));
  document.body.appendChild(cv);
  return cv.toDataURL('image/png');
}

window.renderAll = async () => {
  await Promise.all([`600 15px ${SERIF}`, `italic 500 19px ${SERIF}`, `500 17px ${SERIF}`].map(f => document.fonts.load(f))).catch(() => {});
  const out = [];
  for (let i = 0; i < SLIDES.length; i++) out.push(await render(SLIDES[i], i));
  return out;
};
</script>
</body>
