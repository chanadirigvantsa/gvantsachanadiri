<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Skincare Shelf | Gvantsa Chanadiri</title>
<meta name="description" content="Every skincare product I use: morning, evening and weekly.">
<meta property="og:type" content="website">
<meta property="og:title" content="My Skincare Shelf | Gvantsa Chanadiri">
<meta property="og:description" content="Every skincare product I use: morning, evening and weekly.">
<meta property="og:url" content="https://gvantsachanadiri.com/skincare/">
<meta name="theme-color" content="#f6f1ec">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--bg:#f6f1ec;--card:#fffdfb;--ink:#151312;--mute:#7a716b;--line:#e4dbd3;--ac:#2a14e6;--tag:#efe6de;--ph1:#ecdfd4;--ph2:#d9c5b5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161413;--card:#1f1c1a;--ink:#f3eee9;--mute:#a39890;--line:#332e2b;--ac:#9d93ff;--tag:#2b2623;--ph1:#2a2522;--ph2:#3a322d}}
:root[data-theme="dark"]{--bg:#161413;--card:#1f1c1a;--ink:#f3eee9;--mute:#a39890;--line:#332e2b;--ac:#9d93ff;--tag:#2b2623;--ph1:#2a2522;--ph2:#3a322d}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:300 16px/1.55 "Hanken Grotesk",Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
a,button{color:inherit;font:inherit;background:none;border:0;cursor:pointer;text-decoration:none}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px;border-radius:4px}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
@media(min-width:700px){.wrap{padding:0 32px}}

header.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-size:14px}
header.top a{color:var(--mute)}header.top a:hover{color:var(--ink)}

.hero{padding:56px 0 40px}
.hero h1{font-size:clamp(52px,12vw,128px);line-height:.9;letter-spacing:-.015em}
.hero h1 em{font-style:italic}
.hero p.lead{max-width:520px;margin-top:22px;font-size:19px;line-height:1.45}
.hero .skin{margin-top:14px;color:var(--mute);font-size:14px}
.hero .skin b{font-weight:500;color:var(--ink)}

nav.tabs{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--mute);transition:all .2s}
nav.tabs button:hover{color:var(--ink);border-color:var(--ink)}
nav.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
nav.tabs .n{opacity:.6;margin-left:4px;font-size:12px}

section.routine{padding:48px 0 8px}
section.routine[hidden]{display:none}
.rhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px}
.rhead h2{font-size:clamp(36px,6vw,56px);line-height:1}
.rhead span{color:var(--mute);font-size:14px;white-space:nowrap}

.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid{grid-template-columns:1fr 1fr 1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
@media(max-width:619px){.card .img{aspect-ratio:16/9!important}}
.card .img{aspect-ratio:4/3;background:linear-gradient(160deg,var(--ph1),var(--ph2));display:flex;align-items:center;justify-content:center;position:relative}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card .img .no{font-family:"Instrument Serif",Georgia,serif;font-size:64px;color:var(--card);opacity:.9;line-height:1}
.card .num{position:absolute;top:12px;left:12px;background:var(--card);border-radius:999px;font-size:12px;padding:3px 10px;font-weight:500}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.card .tag{background:var(--tag);border-radius:999px;font-size:12px;padding:3px 10px;color:var(--mute)}
.card .tag.fav{color:var(--ac);font-weight:500}
.card .brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.card h3{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:27px;line-height:1.05}
.card p{color:var(--mute);font-size:15px;line-height:1.5}
.card .buy{margin-top:auto;padding-top:12px;font-size:14px;font-weight:500;display:inline-flex;gap:6px;align-items:center;align-self:flex-start;border-bottom:1px solid currentColor}
.card .buy:hover{color:var(--ac)}

.share{margin:72px 0 0;padding:36px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between}
.share p{font-size:clamp(26px,4vw,36px);line-height:1.1;max-width:520px}
.share button{background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-size:15px;font-weight:500}
.share button:hover{opacity:.85}
footer{padding:0 0 40px;color:var(--mute);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
.note{font-size:13px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="serif" style="font-size:20px">Gvantsa's shelf</span>
    <a href="../">Portfolio ↗</a>
  </header>

  <div class="hero">
    <h1 class="serif" id="title"></h1>
    <p class="lead" id="intro"></p>
    <p class="skin" id="skin"></p>
  </div>

  <nav class="tabs" id="tabs" aria-label="Filter by routine"></nav>
  <main id="list"></main>

  <div class="share">
    <p class="serif">Know someone who keeps asking too?</p>
    <button id="shareBtn" type="button">Share this page</button>
  </div>
  <footer>
    <span id="updated"></span>
    <span>Not sponsored. Just what works for my skin; patch test new things.</span>
  </footer>
</div>
<div id="toast" role="status"></div>

<script src="products.js"></script>
<script>
(function(){
  var D = window.SKINCARE || {products:[]};
  var R = [
    {key:"morning", label:"Morning", sub:"AM routine"},
    {key:"evening", label:"Evening", sub:"PM routine"},
    {key:"weekly",  label:"Weekly & extras", sub:"Once or twice a week"}
  ];
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function safeUrl(u){u=String(u||"").trim();return /^(https?:\/\/|images\/|\.\/)/i.test(u)?u:""}

  // Title: italicise the last word for a little editorial flair
  var t = esc(D.title||"My skincare shelf").split(" ");
  if(t.length>1){t[t.length-1]="<em>"+t[t.length-1]+"</em>"}
  document.getElementById("title").innerHTML = t.join(" ");
  document.getElementById("intro").textContent = D.intro||"";
  var skin = document.getElementById("skin");
  if(D.skinType){skin.innerHTML = "My skin: <b>"+esc(D.skinType)+"</b>"} else {skin.remove()}
  document.getElementById("updated").textContent = D.updated ? "Last updated "+D.updated : "";

  var groups = R.map(function(r){
    return {r:r, items:D.products.filter(function(p){return (p.routine||"").toLowerCase()===r.key})};
  }).filter(function(g){return g.items.length});

  // Tabs
  var tabs = document.getElementById("tabs");
  var all = [{key:"all",label:"Everything",n:D.products.length}].concat(groups.map(function(g){return {key:g.r.key,label:g.r.label,n:g.items.length}}));
  tabs.innerHTML = all.map(function(a){return '<button type="button" data-k="'+a.key+'">'+esc(a.label)+'<span class="n">'+a.n+'</span></button>'}).join("");

  // Sections
  var list = document.getElementById("list");
  list.innerHTML = groups.map(function(g){
    return '<section class="routine" data-k="'+g.r.key+'"><div class="rhead"><h2 class="serif">'+esc(g.r.label)+'</h2><span>'+g.items.length+' step'+(g.items.length>1?'s':'')+' · '+esc(g.r.sub)+'</span></div><div class="grid">'+
      g.items.map(function(p,i){
        var img = safeUrl(p.image), link = safeUrl(p.link);
        return '<article class="card"><div class="img">'+
          (img ? '<img src="'+esc(img)+'" alt="'+esc((p.brand?p.brand+" ":"")+p.name)+'" loading="lazy">' : '<span class="no">'+(i+1)+'</span>')+
          '<span class="num">Step '+(i+1)+'</span></div><div class="body"><div class="tags">'+
          (p.step?'<span class="tag">'+esc(p.step)+'</span>':'')+
          (p.favourite?'<span class="tag fav">★ Holy grail</span>':'')+
          '</div>'+(p.brand?'<div class="brand">'+esc(p.brand)+'</div>':'')+
          '<h3>'+esc(p.name)+'</h3>'+(p.why?'<p>'+esc(p.why)+'</p>':'')+
          (link?'<a class="buy" href="'+esc(link)+'" target="_blank" rel="noopener">Where to buy ↗</a>':'')+
          '</div></article>';
      }).join("")+'</div></section>';
  }).join("") || '<p class="note" style="padding:48px 0">No products yet.</p>';

  function show(k){
    tabs.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.k===k);b.setAttribute("aria-pressed",b.dataset.k===k)});
    list.querySelectorAll("section").forEach(function(s){s.hidden = k!=="all" && s.dataset.k!==k});
  }
  tabs.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b)return;
    show(b.dataset.k);
    try{history.replaceState(null,"",b.dataset.k==="all"?location.pathname:"#"+b.dataset.k)}catch(_){}
  });
  var h=location.hash.slice(1);
  show(all.some(function(a){return a.key===h})?h:"all");

  // Share
  var toast=document.getElementById("toast"),tt;
  function say(m){toast.textContent=m;toast.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove("show")},2200)}
  document.getElementById("shareBtn").addEventListener("click",function(){
    var url=location.origin+location.pathname;
    if(navigator.share){navigator.share({title:document.title,url:url}).catch(function(){});return}
    if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){say("Link copied")},function(){say(url)})}else{say(url)}
  });
})();
</script>
</body>
</html>
