<title>Muguet Frame</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one 4:5 white canvas, centred; lily of the valley grows in from the four edges, the middle stays empty for text */
  :root {
    --paper: #ffffff;
    --ink-soft: #8a9a84;
    --ink: #4d6343;
    --font-ui: Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  canvas {
    display: block;
    max-width: 100%;
    height: auto;
    background: var(--paper);
  }
  .bar { display: flex; gap: 20px; }
  button {
    font: inherit;
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: none;
    border: 0;
    padding: 6px 4px;
    cursor: pointer;
  }
  button:hover, button[aria-pressed="true"] { color: var(--ink); }
  button[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 5px; }
  button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
  body.export .bar { display: none; }
  body.export { padding: 0; gap: 0; }
  body.export canvas { width: 1080px !important; height: auto; }
</style>

<canvas id="c" width="1080" height="1920" aria-label="Lily of the valley sprigs blossoming around the edges of a white frame"></canvas>
<div class="bar">
  <button id="replay" type="button">Replay</button>
  <button type="button" data-fmt="reel" aria-pressed="true">Reel 9:16</button>
  <button type="button" data-fmt="post" aria-pressed="false">Post 4:5</button>
</div>

<script>
(() => {
  const W = 1080;
  let H = 1920;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  const C = {
    stem: '#6c8c4a',
    stemDark: '#557538',
    leafDeep: '#3f6a34',
    leafMid: '#62904a',
    leafLight: '#a6c67a',
    vein: 'rgba(225,238,200,0.55)',
    petal: '#ffffff',
    petalShade: '#e2e9da',
    petalLine: 'rgba(120,140,108,0.75)',
    mouth: 'rgba(160,178,148,0.35)',
    bud: 'rgba(186,212,150,',
  };

  // seeded random so every play (and the video) is identical
  let seed = 7;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
  const back = t => { t = clamp(t); const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

  // ---- composition: one bottom-left corner cluster, mirrored to all four corners, plus edge sprigs
  const corner = {
    stems: [
      { x: 150, y: 1352, a: -1.95, bend: 2.0, L: 410, bells: 10, d: 0.5 },
      { x: 108, y: 1352, a: -1.62, bend: -0.38, L: 440, bells: 9, d: 0.9 },
      { x: 196, y: 1352, a: -1.28, bend: 1.05, L: 245, bells: 6, d: 1.3 },
    ],
    leaves: [
      { x: 140, y: 1356, a: -1.86, L: 370, w: 88, curl: -0.14, d: 0.0, front: false },
      { x: 150, y: 1356, a: -1.22, L: 330, w: 82, curl: 0.12, d: 0.2, front: true },
      { x: 160, y: 1356, a: -0.70, L: 260, w: 70, curl: 0.18, d: 0.4, front: true },
    ],
  };
  const sideSet = {
    stems: [{ x: -6, y: 650, a: -0.28, bend: 1.15, L: 235, bells: 6, d: 1.6 }],
    leaves: [{ x: -6, y: 660, a: -0.05, L: 170, w: 48, curl: 0.2, d: 1.2, front: true }],
  };
  const midSet = {
    stems: [{ x: 610, y: 1358, a: -2.62, bend: 0.75, L: 250, bells: 7, d: 1.9 }],
    leaves: [
      { x: 610, y: 1360, a: -2.35, L: 190, w: 52, curl: -0.15, d: 1.5, front: true },
      { x: 615, y: 1360, a: -0.95, L: 165, w: 46, curl: 0.18, d: 1.7, front: false },
    ],
  };

  const mirrorX = o => ({ ...o, x: W - o.x, a: Math.PI - o.a, bend: o.bend !== undefined ? -o.bend : undefined, curl: o.curl !== undefined ? -o.curl : undefined });
  const mirrorY = o => ({ ...o, y: H - o.y, a: -o.a, bend: o.bend !== undefined ? -o.bend : undefined, curl: o.curl !== undefined ? -o.curl : undefined });
  const ids = o => o, both = o => mirrorY(mirrorX(o));

  const stems = [], leaves = [];
  const atY = y => o => ({ ...o, y: o.y - 650 + y });   // move the side sprig to height y
  function place(set, tf, delay) {
    set.stems.forEach(s => {
      const o = tf(s);
      o.d += delay + rnd() * 0.15;
      o.phase = rnd() * 6.28;
      o.sizes = [];
      for (let i = 0; i < o.bells; i++) o.sizes.push(0.9 + rnd() * 0.2);
      stems.push(o);
    });
    set.leaves.forEach(l => { const o = tf(l); o.d += delay; o.phase = rnd() * 6.28; leaves.push(o); });
  }
  function build(fmt) {
    seed = 7;
    stems.length = 0; leaves.length = 0;
    H = fmt === 'post' ? 1350 : 1920;
    cv.height = H;
    cv.style.aspectRatio = `${W} / ${H}`;
    cv.style.width = `min(100%, calc((100vh - 96px) * ${W / H}))`;
    // corner and middle sets are drawn for a 1350px frame; keep them on the bottom edge
    const btm = o => ({ ...o, y: o.y + H - 1350 });
    const bl = btm, br = o => mirrorX(btm(o)), tl = o => mirrorY(btm(o)), tr = o => both(btm(o));
    place(corner, bl, 0);
    place(corner, br, 0.35);
    place(corner, tl, 0.7);
    place(corner, tr, 1.0);
    if (fmt === 'post') {
      place(sideSet, ids, 0.2);
      place(sideSet, mirrorX, 0.5);
    } else {
      // the taller Reels frame gets two sprigs on each side
      place(sideSet, atY(H * 0.36), 0.2);
      place(sideSet, o => mirrorX(atY(H * 0.6)(o)), 0.4);
      place(sideSet, o => mirrorX(atY(H * 0.36)(o)), 0.6);
      place(sideSet, atY(H * 0.6), 0.8);
    }
    place(midSet, bl, 0.1);
    place(midSet, tr, 0.6);
    document.querySelectorAll('[data-fmt]').forEach(b => b.setAttribute('aria-pressed', b.dataset.fmt === fmt));
  }
  const params = new URLSearchParams(location.search);
  build(params.get('format') === 'post' ? 'post' : 'reel');

  const GROW = 3.2;   // seconds for a stem to reach full length

  // ---- stem geometry
  function stemPoints(s, t, len) {
    const N = 70, pts = [];
    const sway = Math.sin(t * 0.8 + s.phase) * 0.05 * clamp((t - s.d - GROW) / 1.5);
    let x = s.x, y = s.y;
    pts.push({ x, y, a: s.a });
    for (let i = 1; i <= N; i++) {
      const u = i / N;
      const a = s.a + (s.bend + sway) * Math.pow(u, 1.3);
      const step = len / N;
      x += Math.cos(a) * step; y += Math.sin(a) * step;
      pts.push({ x, y, a });
    }
    return pts;
  }

  function drawStem(pts, prog) {
    const n = Math.max(1, Math.floor(prog * (pts.length - 1)));
    ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const u = i / (pts.length - 1);
      ctx.strokeStyle = u < 0.25 ? C.stemDark : C.stem;
      ctx.lineWidth = 5.2 - 3.6 * u;
      ctx.beginPath();
      ctx.moveTo(pts[i].x, pts[i].y);
      ctx.lineTo(pts[i + 1].x, pts[i + 1].y);
      ctx.stroke();
    }
  }

  // ---- one bell (local: attached at 0,0, hanging toward +y)
  function drawBell(h, open) {
    const w = h * (0.8 + 0.14 * open);
    const f = open * w * 0.2;
    const lip = h * (0.84 - open * 0.06);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(w * 0.42, 0, w * 0.56, h * 0.34, w * 0.5, h * 0.72);
    ctx.bezierCurveTo(w * 0.5, h * 0.86, w * 0.5 + f, h * 0.9, w * 0.5 + f * 1.25, lip);
    ctx.quadraticCurveTo(w * 0.44, h * 1.0, w * 0.18, h * 0.96);
    ctx.quadraticCurveTo(w * 0.06, h * (1.02 + open * 0.1), 0, h * (1.03 + open * 0.1));
    ctx.quadraticCurveTo(-w * 0.06, h * (1.02 + open * 0.1), -w * 0.18, h * 0.96);
    ctx.quadraticCurveTo(-w * 0.44, h * 1.0, -(w * 0.5 + f * 1.25), lip);
    ctx.bezierCurveTo(-(w * 0.5 + f), h * 0.9, -w * 0.5, h * 0.86, -w * 0.5, h * 0.72);
    ctx.bezierCurveTo(-w * 0.56, h * 0.34, -w * 0.42, 0, 0, 0);
    ctx.closePath();

    const g = ctx.createRadialGradient(-w * 0.16, h * 0.32, h * 0.05, 0, h * 0.5, h * 0.75);
    g.addColorStop(0, C.petal);
    g.addColorStop(0.6, '#fbfcf8');
    g.addColorStop(1, C.petalShade);
    ctx.fillStyle = g;
    ctx.shadowColor = 'rgba(70,95,60,0.16)';
    ctx.shadowBlur = 7;
    ctx.shadowOffsetY = 2;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    if (open < 0.9) { ctx.fillStyle = C.bud + ((1 - open) * 0.7).toFixed(3) + ')'; ctx.fill(); }
    ctx.strokeStyle = C.petalLine;
    ctx.lineWidth = 1;
    ctx.stroke();

    // soft ribs and the shadow inside the mouth
    ctx.strokeStyle = 'rgba(150,168,140,0.35)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(w * 0.05, h * 0.1); ctx.quadraticCurveTo(w * 0.24, h * 0.5, w * 0.18, h * 0.92);
    ctx.moveTo(-w * 0.05, h * 0.1); ctx.quadraticCurveTo(-w * 0.24, h * 0.5, -w * 0.18, h * 0.92);
    ctx.stroke();
    if (open > 0.2) {
      ctx.fillStyle = C.mouth;
      ctx.globalAlpha = open;
      ctx.beginPath();
      ctx.ellipse(0, h * 0.9, w * 0.36, h * 0.05, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    // little green cap where the bell meets its stalk
    ctx.fillStyle = C.stem;
    ctx.beginPath(); ctx.ellipse(0, h * 0.03, w * 0.1, h * 0.06, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawBells(s, pts, t, prog) {
    const n = s.bells;
    for (let i = 0; i < n; i++) {
      const fr = 0.38 + 0.58 * (i / (n - 1));          // along the stem, base -> tip
      if (prog < fr) continue;
      const born = s.d + GROW * fr + 0.05;
      const bud = easeOut((t - born) / 0.7);
      if (bud <= 0) continue;
      const tipRank = (n - 1 - i);                     // 0 at the very tip
      const maxOpen = tipRank === 0 ? 0.0 : tipRank === 1 ? 0.25 : 1;
      const open = maxOpen * ease((t - born - 0.55) / 1.1);
      const size = (44 - 20 * (i / (n - 1))) * s.sizes[i];

      const p = pts[Math.round(fr * (pts.length - 1))];
      let nx = -Math.sin(p.a), ny = Math.cos(p.a);
      if (ny < 0 || (Math.abs(ny) < 0.25 && nx * Math.sign(s.bend || 1) < 0)) { nx = -nx; ny = -ny; }
      const swing = Math.sin(t * 1.3 + s.phase + i * 0.7) * 0.07;
      const ax = Math.sin(swing) + nx * 0.18, ay = Math.cos(swing);
      const al = Math.hypot(ax, ay);
      const pl = (14 + size * 0.45) * back(bud);
      const p1x = p.x + nx * pl * 0.75, p1y = p.y + ny * pl * 0.75;
      const p2x = p1x + ax / al * pl * 0.55, p2y = p1y + ay / al * pl * 0.55;

      ctx.strokeStyle = C.stem;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.quadraticCurveTo(p1x, p1y, p2x, p2y);
      ctx.stroke();

      ctx.save();
      ctx.translate(p2x, p2y);
      ctx.rotate(Math.atan2(ay, ax) - Math.PI / 2);
      ctx.scale(back(bud), back(bud));
      drawBell(size * (0.55 + 0.45 * Math.max(open, tipRank > 1 ? bud * 0.3 : 0)), open);
      ctx.restore();
    }
  }

  // ---- broad leaf with parallel veins (local: base at 0,0, pointing +x)
  function drawLeaf(l, t) {
    const g0 = (t - l.d) / 1.9;
    if (g0 <= 0) return;
    const g = easeOut(g0);
    const sway = Math.sin(t * 0.7 + l.phase) * 0.015 * clamp(g0 - 1);
    const L = l.L * g, w = l.w * Math.pow(g, 0.6);
    const c = l.curl * L;
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.a + sway + (1 - g) * 0.25 * Math.sign(l.curl || 1));
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(L * 0.25, -w * 0.62, L * 0.72, -w * 0.5 + c * 0.6, L, c);
    ctx.bezierCurveTo(L * 0.7, w * 0.36 + c * 0.6, L * 0.25, w * 0.52, 0, 0);
    ctx.closePath();
    const gr = ctx.createLinearGradient(0, -w * 0.5, L * 0.6, w * 0.5);
    gr.addColorStop(0, l.front ? C.leafMid : C.leafDeep);
    gr.addColorStop(0.55, l.front ? '#7aa556' : C.leafMid);
    gr.addColorStop(1, C.leafLight);
    ctx.fillStyle = gr;
    ctx.fill();
    ctx.strokeStyle = 'rgba(52,86,40,0.45)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.strokeStyle = C.vein;
    for (let k = -2; k <= 2; k++) {
      ctx.lineWidth = k === 0 ? 1.4 : 0.8;
      ctx.beginPath();
      ctx.moveTo(L * 0.02, 0);
      ctx.quadraticCurveTo(L * 0.45, k * w * 0.16 + c * 0.35, L * 0.97, c);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- frame
  function renderAt(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    leaves.filter(l => !l.front).forEach(l => drawLeaf(l, t));
    stems.forEach(s => {
      const prog = ease((t - s.d) / GROW);
      if (prog <= 0) return;
      const pts = stemPoints(s, t, s.L);
      drawStem(pts, prog);
      s._pts = pts; s._prog = prog;
    });
    leaves.filter(l => l.front).forEach(l => drawLeaf(l, t));
    stems.forEach(s => { if (s._prog > 0) drawBells(s, s._pts, t, s._prog); });
  }
  window.renderAt = renderAt;

  const exportMode = /export/.test(location.search);
  if (exportMode) { document.body.classList.add('export'); renderAt(0); return; }

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let start = performance.now();
  function loop(now) {
    renderAt((now - start) / 1000);
    requestAnimationFrame(loop);
  }
  if (reduce) renderAt(9);
  else requestAnimationFrame(loop);
  document.getElementById('replay').addEventListener('click', () => {
    start = performance.now();
    if (reduce) renderAt(9);
  });
  document.querySelectorAll('[data-fmt]').forEach(b => b.addEventListener('click', () => {
    build(b.dataset.fmt);
    start = performance.now();
    if (reduce) renderAt(9);
  }));
})();
</script>
