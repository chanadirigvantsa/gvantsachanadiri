<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name — Content Manager & Creative Producer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500&display=swap">
<style>
:root{--bg:#fff;--ink:#0a0a0a;--mute:#8a8a8a;--line:#e3e3e3;--ph1:#cdcdcd;--ph2:#6a6a6a;--ph3:#efefef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#f2f2f2;--mute:#7c7c7c;--line:#222;--ph1:#2a2a2a;--ph2:#0e0e0e;--ph3:#3c3c3c}}
:root[data-theme="dark"]{--bg:#000;--ink:#f2f2f2;--mute:#7c7c7c;--line:#222;--ph1:#2a2a2a;--ph2:#0e0e0e;--ph3:#3c3c3c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:300 15px/1.55 "Hanken Grotesk",Helvetica,Arial,sans-serif}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
a,button{color:inherit;font:inherit;background:none;border:0;cursor:pointer;text-decoration:none;text-align:left}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;padding:18px 22px;background:var(--bg)}
header nav{display:flex;gap:13px;font-size:14px}
header .on{border-bottom:1px solid var(--ink)}
main{padding:0 22px 80px;max-width:1280px;margin:auto}
.ph{background:linear-gradient(160deg,var(--ph3),var(--ph1) 55%,var(--ph2));position:relative;display:flex;align-items:flex-end;padding:10px;color:var(--mute);font-size:11px}
.hero{display:grid;grid-template-columns:1fr;gap:28px;padding-top:24px}
.hero h1{font-size:clamp(56px,13vw,150px);line-height:.88;letter-spacing:-.02em}
.hero .ph{aspect-ratio:4/5}
.hero p.t{font-size:17px;margin-top:20px}
@media(min-width:800px){.hero{grid-template-columns:1.25fr 1fr;align-items:end}}
.intro{max-width:520px;margin:90px 0 70px;font-size:22px;line-height:1.4}
.intro.serif{font-size:30px}
.filters{display:flex;flex-wrap:wrap;gap:6px 20px;margin-bottom:14px;color:var(--mute)}
.filters .on{color:var(--ink);border-bottom:1px solid var(--ink)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:18px 0;border-top:1px solid var(--line);width:100%;align-items:baseline;transition:padding .25s}
.row:hover{padding-left:12px}
.row .b{font-size:clamp(30px,6vw,60px);line-height:1}
.row .m{color:var(--mute);font-size:13px}
.row .r{grid-column:1/-1;color:var(--mute);font-size:13px}
.row.hide{display:none}
h2.serif{font-size:clamp(34px,6vw,64px);line-height:1}
.pgrid{display:grid;gap:14px;margin:40px 0}
.pgrid .ph{aspect-ratio:3/4}.pgrid .w{aspect-ratio:16/9}
@media(min-width:800px){.pgrid{grid-template-columns:repeat(12,1fr)}.pgrid .a{grid-column:1/6}.pgrid .b2{grid-column:7/13;margin-top:120px}.pgrid .w{grid-column:1/13}}
.role{display:grid;gap:0;margin:40px 0}
.role div{display:grid;grid-template-columns:130px 1fr;padding:14px 0;border-top:1px solid var(--line)}
.role dt{color:var(--mute)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:26px 0;color:var(--mute);font-size:13px}
.meta b{display:block;color:var(--ink);font-weight:400;font-size:15px}
.cols{display:grid;gap:30px}
@media(min-width:800px){.cols{grid-template-columns:1fr 1fr}}
.big{font-size:clamp(34px,7vw,84px);line-height:1;word-break:break-word}
.two{display:grid;gap:0;margin:20px 0 70px}.two>div{padding:22px 0;border-top:1px solid var(--ink)}.two h3{font-size:34px;line-height:1;font-weight:400}.two p{color:var(--mute);margin:10px 0 14px;max-width:380px}.two li{list-style:none;padding:7px 0;border-top:1px solid var(--line)}.two ul{padding:0}@media(min-width:800px){.two{grid-template-columns:1fr 1fr;gap:40px}}.role h3{font-weight:400;font-size:13px;color:var(--mute);padding-top:26px}.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:30px 0}.ig .ph{aspect-ratio:4/5;padding:6px;font-size:10px}.ig .ph b{font-weight:400;color:var(--ink)}.ig a:hover .ph{opacity:.8}.lk{display:block;padding:14px 0;border-top:1px solid var(--line);font-size:24px}
footer{padding:30px 22px;color:var(--mute);font-size:12px;display:flex;justify-content:space-between}
@media(prefers-reduced-motion:no-preference){.hero h1{animation:in 1.1s ease both}@keyframes in{from{opacity:0;letter-spacing:.04em}}}

body{font-size:14px;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
header{align-items:baseline;padding:22px;border-bottom:1px solid var(--line)}
header nav{text-transform:uppercase;font-size:10.5px;letter-spacing:.16em;gap:12px}
header a.serif{font-size:22px;text-transform:none;letter-spacing:0}
header .on{border-bottom:0;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.ph{filter:grayscale(1);background:linear-gradient(170deg,var(--ph3),var(--ph1) 50%,var(--ph2));font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.hero{padding-top:56px;gap:44px}
.hero h1{font-weight:400;font-size:clamp(64px,15vw,190px);line-height:.82;letter-spacing:-.035em}
.hero p.t{font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-top:34px}
.intro{margin:170px 0 130px;max-width:640px}
.intro.serif{font-size:clamp(28px,4vw,44px);line-height:1.18}
h2.serif{font-size:clamp(30px,5vw,52px);font-style:italic}
.filters{text-transform:uppercase;font-size:10.5px;letter-spacing:.16em;margin-bottom:26px;gap:8px 26px}
.filters .on{border-bottom:0;text-decoration:underline;text-underline-offset:6px}
.row{padding:30px 0}
.row:hover{padding-left:0}
.row:hover .b{font-style:italic}
.row .b{font-size:clamp(32px,6.5vw,72px);letter-spacing:-.02em}
.row .r{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em}
.two{background:#000;color:#fff;padding:32px 24px;margin:30px 0 150px}
.two>div{border-top:1px solid #fff}
.two h3{font-size:40px}.two p{color:#9a9a9a}.two li{border-top:1px solid #2c2c2c;font-size:13px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .two{border:1px solid var(--line)}}
.role dt,.role h3{text-transform:uppercase;font-size:10.5px;letter-spacing:.16em}
.role h3{padding-top:40px}
.role div{padding:18px 0}
.big{font-weight:400;letter-spacing:-.03em}
.meta{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em}.meta b{text-transform:none;letter-spacing:0;margin-top:4px}
.ig{gap:2px}
.lk{font-family:"Instrument Serif",Georgia,serif;font-size:30px;padding:20px 0}
.lk:hover{font-style:italic}
footer{border-top:1px solid var(--line);margin-top:40px;font-size:10px;text-transform:uppercase;letter-spacing:.16em}
</style></head><body>
<header><a href="#home" class="serif" style="font-size:20px">Your Name</a>
<nav><a href="#work" data-n="work">Work</a><a href="#social" data-n="social">Social</a><a href="#personal" data-n="personal">Personal</a><a href="#about" data-n="about">About</a><a href="#contact" data-n="contact">Contact</a></nav></header>
<main id="app"></main>
<footer><span>Content Manager &amp; Creative Producer</span><span>Archive 2026</span></footer>
<script>
var P=[
{id:"rick",s:"b",b:"adidas x Rick Owens",t:"Collection campaign",d:"Photo",y:"2025",r:"Content management, production coordination",
 o:"Shape a campaign content plan that matched the collaboration's severe, sculptural language.",
 role:[["Managed","Content calendar, asset approvals, delivery across channels"],["Produced","Shoot logistics, call sheets, studio and talent scheduling"],["Coordinated","Photographer, stylist, casting, brand and regional teams"],["Contributed","Image selection and sequencing for launch"]],
 c:"Photographer, Stylist, Casting, adidas Brand team"},
{id:"wales",s:"p",b:"adidas x Wales Bonner",t:"Launch film and stills",d:"Video",y:"2026",r:"Content management, coordination",
 o:"Bring a culturally rooted collaboration to audiences through film and still imagery.",
 role:[["Managed","Rollout plan, content approvals, timeline"],["Produced","Film schedule and deliverables"],["Coordinated","Director, producer, agency, brand"],["Contributed","Edit feedback, caption and copy direction"]],c:"Director, Producer, Agency, adidas Brand team"},
{id:"simone",s:"c",b:"adidas x Simone Rocha",t:"Editorial and social rollout",d:"Social",y:"2025",r:"Content management, copy",
 o:"Translate a romantic, tactile collaboration into a cohesive digital story.",
 role:[["Managed","Instagram planning and publishing"],["Produced","Asset requests and cutdowns"],["Coordinated","Community and brand teams"],["Contributed","Captions and story sequencing"]],c:"Photographer, Social team, adidas Brand team"},
{id:"avavav",s:"p",b:"adidas x AVAVAV",t:"Campaign content",d:"Production",y:"2025",r:"Production coordination",
 o:"Deliver playful, fast-moving content to a tight launch window.",
 role:[["Managed","Delivery plan and approvals"],["Produced","On-set coordination"],["Coordinated","Creative team, agency, logistics"],["Contributed","Selects and rollout notes"]],c:"Creative team, Agency, adidas Brand team"},
{id:"ysl",s:"b",b:"YSL Beauty",t:"Beauty content series",d:"Photo",y:"2024",r:"Content management, production",
 o:"Keep a beauty campaign consistent across stills, video and social.",
 role:[["Managed","Content plan across formats"],["Produced","Shoot preparation and delivery"],["Coordinated","Makeup artists, photographer, brand"],["Contributed","Visual references and selects"]],c:"Photographer, Makeup, Brand team"},
{id:"valentino",s:"c",b:"Valentino Beauty",t:"Interview and editorial",d:"Articles",y:"2024",r:"Editorial, content development",
 o:"Develop long-form brand storytelling with a distinct editorial voice.",
 role:[["Managed","Editorial calendar and approvals"],["Produced","Interview logistics"],["Coordinated","Writers, editors, brand"],["Contributed","Copywriting and editing"]],c:"Writer, Editor, Brand team"},
{id:"armani",s:"c",b:"Armani Beauty",t:"Digital content programme",d:"Social",y:"2024",r:"Content management",
 o:"Plan and execute a steady, polished digital presence.",
 role:[["Managed","Monthly planning and reporting"],["Produced","Content execution"],["Coordinated","Creators, brand, agency"],["Contributed","Caption and format ideas"]],c:"Creators, Agency, Brand team"}];
var D=[["All","All"],["c","Content management"],["p","Creative production"]],SL={c:"Content management",p:"Creative production",b:"Content management + production"},G={Managed:"c",Produced:"p",Coordinated:"p",Contributed:"x"},GL={c:"Content management",p:"Creative production",x:"Creative contribution"},f="All",app=document.getElementById("app");
function ph(c,l,x){return '<div class="ph '+(c||"")+'" role="img" aria-label="'+l+'">'+l+'</div>'}
function idx(){return '<div class="filters">'+D.map(function(d){return '<button data-f="'+d[0]+'" class="'+(d[0]==f?"on":"")+'">'+d[1]+'</button>'}).join("")+'</div>'+
P.map(function(p){return '<a class="row'+(f!="All"&&p.s!="b"&&p.s!=f?" hide":"")+'" href="#p-'+p.id+'"><span class="b serif">'+p.b+'</span><span class="m">'+p.y+'</span><span class="r">'+SL[p.s]+' &nbsp;/&nbsp; '+p.t+'</span></a>'}).join("")}
function sides(){return '<div class="two"><div><h3 class="serif">Content manager</h3><p>The thinking and the system: what gets made, for whom, when, and how it performs.</p><ul><li>Content strategy and planning</li><li>Editorial and social calendars</li><li>Copy, captions, interviews</li><li>Approvals, reporting, delivery</li></ul></div><div><h3 class="serif">Creative producer</h3><p>The making: getting the right people, place and time in one room and the work finished well.</p><ul><li>Shoot and film production</li><li>Call sheets, casting, logistics</li><li>Photographers, stylists, directors</li><li>On-set coordination, asset handover</li></ul></div></div>'}
var IG=[["Reel","Launch teaser","Plan, edit notes"],["Carousel","Collection story","Copy, sequencing"],["Post","Campaign still","Publishing"],["Reel","Behind the scenes","Produce, capture"],["Story","Launch day","Plan, publish"],["Carousel","Interview excerpt","Edit, copy"],["Post","Product detail","Planning"],["Reel","Film cutdown","Coordinate"],["Post","Community","Moderate"]];
function igGrid(n){return '<div class="ig">'+IG.slice(0,n).map(function(g){return '<a href="#social"><div class="ph" role="img" aria-label="'+g[0]+': '+g[1]+'"><span><b>'+g[0]+'</b><br>'+g[1]+'<br>'+g[2]+'</span></div></a>'}).join("")+'</div>'}
function social(){return '<section style="padding-top:30px"><h1 class="big serif">Instagram</h1><div class="cols" style="margin-top:24px"><p style="font-size:20px">Content I planned, wrote, coordinated and published for brand accounts. Each tile names the format and my part in it.</p><p style="color:var(--mute)">Accounts: adidas, YSL Beauty, Armani Beauty<br>Scope: planning, copy, publishing, reporting</p></div>'+igGrid(9)+'<a class="lk" href="https://instagram.com/your-handle">Open on Instagram</a></section>'}
function personal(){return '<section style="padding-top:30px"><p style="color:var(--mute)">Personal project</p><h1 class="big serif">Project title</h1><div style="margin:30px 0">'+ph("","Own work: image or film, 16:9").replace('class="ph "','class="ph" style="aspect-ratio:16/9"')+'</div><div class="cols"><p style="font-size:20px">Two or three sentences on why you started it, what it is, and where it stands today.</p><p style="color:var(--mute)">Started 2026. Ongoing.<br>Format: zine, series, film or newsletter.<br><a href="#" style="border-bottom:1px solid var(--ink);color:var(--ink)">View project</a></p></div></section>'}
function home(){return '<section class="hero"><div><h1 class="serif">Your<br>Name</h1><p class="t">Content Manager &amp; Creative Producer</p><p style="color:var(--mute)">Fashion, beauty, culture</p></div>'+ph("","Cover image or muted film loop, 4:5")+'</section>'+
'<p class="intro serif">I manage and produce content from first plan to final delivery, for fashion and beauty houses that care how things look and how they run.</p>'+
'<h2 class="serif" style="margin-bottom:22px">Two sides of the work</h2>'+sides()+'<h2 class="serif" style="margin-bottom:22px">Selected work</h2><div id="ix">'+idx()+'</div><h2 class="serif" style="margin:70px 0 0">Instagram content</h2>'+igGrid(3)+'<a class="row" href="#social"><span class="b serif">All social content</span><span class="m">9 pieces</span><span class="r">Content management / planning, copy, publishing</span></a><a class="row" href="#personal" style="margin-top:70px"><span class="b serif">Personal project</span><span class="m">Ongoing</span><span class="r">Own work, outside client briefs</span></a>'}
function proj(p){var i=P.indexOf(p),n=P[(i+1)%P.length];
return '<section style="padding-top:30px"><p class="m" style="color:var(--mute)">'+p.d+', '+p.y+'</p><h1 class="big serif">'+p.b+'</h1><p style="font-size:19px;margin-top:8px">'+p.t+'</p></section>'+
ph("w","Hero still or film, 16:9")+'<div class="cols" style="margin-top:40px"><div><div class="meta"><span>Brand<b>'+p.b.split(" x ")[0]+'</b></span><span>My role<b>'+p.r+'</b></span><span>Year<b>'+p.y+'</b></span><span>Format<b>'+p.d+'</b></span></div></div><div><p style="font-size:20px">'+p.o+'</p></div></div>'+
roles(p)+'<div class="pgrid">'+ph("a","Image 3:4")+ph("b2","Image 3:4")+ph("w","Process: call sheet or moodboard, 16:9")+'</div>'+
'<p class="m" style="color:var(--mute)">Collaborators<br><span style="color:var(--ink)">'+p.c+'</span></p>'+
'<a class="row" href="#p-'+n.id+'" style="margin-top:50px"><span class="b serif">Next: '+n.b+'</span></a>'}
function roles(p){var o='<dl class="role">';["c","p","x"].forEach(function(g){var rs=p.role.filter(function(r){return G[r[0]]==g});if(rs.length)o+='<h3>'+GL[g]+'</h3>'+rs.map(function(r){return '<div><dt>'+r[0]+'</dt><dd>'+r[1]+'</dd></div>'}).join("")});return o+'</dl>'}
function about(){return '<section class="cols" style="padding-top:30px"><div><h1 class="big serif">Organised work, seen clearly.</h1></div><div>'+ph("","Portrait, 4:5").replace('class="ph "','class="ph" style="aspect-ratio:4/5;margin-bottom:24px"')+
'<p style="font-size:18px">I plan, produce and deliver content for fashion and beauty brands. I work between brand teams, photographers, filmmakers, stylists and agencies, and keep projects on time and on tone.</p><p style="margin-top:16px;color:var(--mute)">My eye for visual culture shapes what I select and how I brief. The titles on the work are managing and producing, and I say so on every page.</p></div></section>'+
'<div style="margin-top:70px">'+sides()+'</div><a class="lk" href="cv.pdf">Download CV (PDF)</a><a class="lk" href="https://www.linkedin.com/in/your-profile">LinkedIn</a>'}
function contact(){return '<section style="padding-top:60px"><p style="color:var(--mute)">For brands, agencies and collaborators</p><a class="big serif" href="mailto:hello@yourname.com" style="display:block;margin:20px 0 40px">hello@<br>yourname.com</a><div style="max-width:520px"><a class="lk" href="https://www.linkedin.com/in/your-profile">LinkedIn</a><a class="lk" href="cv.pdf">CV (PDF)</a><a class="lk" href="https://instagram.com/your-handle">Instagram</a></div></section>'}
function route(){var h=location.hash.slice(1)||"home",v;
if(h.indexOf("p-")==0){var p=P.filter(function(x){return "p-"+x.id==h})[0];v=p?proj(p):home()}
else v=h=="social"?social():h=="personal"?personal():h=="about"?about():h=="contact"?contact():h=="work"?'<section style="padding-top:30px"><h1 class="big serif" style="margin-bottom:30px">Work</h1><div id="ix">'+idx()+'</div></section>':home();
app.innerHTML=v;window.scrollTo(0,0);
document.querySelectorAll("[data-n]").forEach(function(a){a.classList.toggle("on",a.dataset.n==h)})}
app.addEventListener("click",function(e){var b=e.target.closest("[data-f]");if(b){f=b.dataset.f;document.getElementById("ix").innerHTML=idx()}});
window.addEventListener("hashchange",route);route();
</script></body></html>
