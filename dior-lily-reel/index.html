<title>Muguet Quote Reel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=block">
<style>
  /* Layout: one tall white canvas, centred; watercolour lily of the valley grows from the bottom edge, the Dior quote sits in the middle */
  :root {
    --paper: #ffffff;
    --ink-soft: #8b9a8f;
    --ink: #2f4a3a;
    --font-ui: "Gloria Hallelujah", "Comic Sans MS", cursive;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  canvas { display: block; max-width: 100%; height: auto; background: var(--paper); box-shadow: 0 0 0 1px #eef1ee; }
  .bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
  button {
    font: inherit;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    background: none;
    border: 0;
    padding: 6px 4px;
    cursor: pointer;
  }
  button:hover, button[aria-pressed="true"] { color: var(--ink); }
  button[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 5px; }
  button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
  body.export .bar { display: none; }
  body.export { padding: 0; gap: 0; }
  body.export canvas { width: 1080px !important; box-shadow: none; }
</style>

<canvas id="c" width="1080" height="1920" aria-label="Watercolour lily of the valley growing from the bottom edge beneath the quote: After Women, flowers are the most divine creations. Christian Dior"></canvas>
<div class="bar">
  <button id="replay" type="button">Replay</button>
  <button id="text" type="button" aria-pressed="true">Quote</button>
  <button type="button" data-fmt="reel" aria-pressed="true">Reel 9:16</button>
  <button type="button" data-fmt="post" aria-pressed="false">Post 4:5</button>
</div>

<script>
(() => {
  const W = 1080;
  let H = 1920, SC = 1;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  const QUOTE = ['After Women,', 'flowers are the most', 'divine creations', 'Christian Dior'];
  const FONT = '"Gloria Hallelujah", "Comic Sans MS", cursive';
  let showText = true;

  const C = {
    stem: 'rgba(66,146,88,0.85)',
    stemDeep: 'rgba(38,112,66,0.9)',
    pencil: 'rgba(122,92,112,0.55)',
    ink: '#1d1d1b',
  };

  let seed = 5;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
  const back = t => { t = clamp(t); const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const off = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };

  // ---------- watercolour leaf, painted once into its own canvas
  function leafPath(g, L, w, c, j) {
    const J = () => (rnd() - 0.5) * j;
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(L * 0.22 + J(), -w * 0.5 + J(), L * 0.62 + J(), -w * 0.62 + c * 0.5 + J(), L, c);
    g.bezierCurveTo(L * 0.64 + J(), w * 0.42 + c * 0.5 + J(), L * 0.24 + J(), w * 0.44 + J(), 0, 0);
    g.closePath();
  }
  function paintLeaf(L, w, curl, tone) {
    const pad = 40, cw = L + pad * 2, ch = w * 1.6 + Math.abs(curl * L) * 2 + pad * 2;
    const cnv = off(cw, ch), g = cnv.getContext('2d');
    const ox = pad, oy = ch / 2;
    g.translate(ox, oy);
    const c = curl * L;
    const base = tone ? 'rgba(52,150,92,' : 'rgba(40,132,84,';
    // layered washes, each slightly shifted, like several glazes of paint
    g.filter = 'blur(1.2px)';
    for (let k = 0; k < 4; k++) { leafPath(g, L, w, c, 10); g.fillStyle = base + (k ? 0.16 : 0.38) + ')'; g.fill(); }
    g.filter = 'none';
    g.save();
    leafPath(g, L, w, c, 0); g.clip();
    // deeper pigment pooled on one half, lifted light on the other
    g.filter = 'blur(14px)';
    g.fillStyle = 'rgba(16,96,58,0.42)';
    g.beginPath(); g.ellipse(L * 0.5, -w * 0.22 + c * 0.4, L * 0.48, w * 0.26, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(190,230,200,0.45)';
    g.beginPath(); g.ellipse(L * 0.45, w * 0.22 + c * 0.4, L * 0.32, w * 0.12, 0.05, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.beginPath(); g.ellipse(L * 0.85, c * 0.9, L * 0.14, w * 0.14, 0, 0, Math.PI * 2); g.fill();
    // parallel veins brushed in lighter strokes
    g.filter = 'blur(1.5px)';
    for (let k = -3; k <= 3; k++) {
      g.strokeStyle = k === 0 ? 'rgba(220,245,225,0.4)' : 'rgba(220,245,225,0.18)';
      g.lineWidth = k === 0 ? 3 : 2;
      g.beginPath(); g.moveTo(L * 0.04, 0); g.quadraticCurveTo(L * 0.45, k * w * 0.11 + c * 0.35, L * 0.96, c); g.stroke();
    }
    g.filter = 'none';
    // granulation
    for (let k = 0; k < 900; k++) {
      g.fillStyle = rnd() < 0.5 ? 'rgba(10,70,40,0.07)' : 'rgba(255,255,255,0.08)';
      g.fillRect(rnd() * L, (rnd() - 0.5) * w * 1.3 + c * 0.5, 1.6, 1.6);
    }
    g.restore();
    // pigment collecting at the wet edge
    g.filter = 'blur(0.8px)';
    leafPath(g, L, w, c, 2); g.strokeStyle = 'rgba(18,92,52,0.35)'; g.lineWidth = 2.4; g.stroke();
    g.filter = 'none';
    // loose coloured-pencil outline, a little off register
    g.translate(2, -1.5);
    leafPath(g, L, w, c, 5); g.strokeStyle = C.pencil; g.lineWidth = 1.2; g.stroke();
    return { cnv, ox, oy };
  }

  // ---------- bell sprites: 11 opening stages painted once
  const BELL = 100, BELLS = [];
  function bellPath(g, h, open) {
    const w = h * (0.82 + 0.12 * open);
    const f = open * w * 0.3;
    const lip = h * (0.86 - open * 0.1);
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(w * 0.44, 0, w * 0.56, h * 0.36, w * 0.5, h * 0.72);
    g.bezierCurveTo(w * 0.5, h * 0.86, w * 0.5 + f * 0.6, h * 0.86, w * 0.5 + f * 1.25, lip);
    g.quadraticCurveTo(w * 0.44, h * 1.0, w * 0.22, h * 0.96);
    g.quadraticCurveTo(w * 0.07, h * (1.0 + open * 0.14), 0, h * (1.04 + open * 0.14));
    g.quadraticCurveTo(-w * 0.07, h * (1.0 + open * 0.14), -w * 0.22, h * 0.96);
    g.quadraticCurveTo(-w * 0.44, h * 1.0, -(w * 0.5 + f * 1.25), lip);
    g.bezierCurveTo(-(w * 0.5 + f * 0.6), h * 0.86, -w * 0.5, h * 0.86, -w * 0.5, h * 0.72);
    g.bezierCurveTo(-w * 0.56, h * 0.36, -w * 0.44, 0, 0, 0);
    g.closePath();
  }
  function paintBells() {
    BELLS.length = 0;
    for (let s = 0; s <= 10; s++) {
      const open = s / 10, h = BELL;
      const cnv = off(h * 1.8, h * 1.5), g = cnv.getContext('2d');
      g.translate(h * 0.9, h * 0.12);
      bellPath(g, h, open);
      g.fillStyle = '#ffffff'; g.fill();
      g.save(); bellPath(g, h, open); g.clip();
      g.filter = 'blur(9px)';
      g.fillStyle = 'rgba(150,196,168,0.45)';
      g.beginPath(); g.ellipse(h * 0.32, h * 0.55, h * 0.22, h * 0.5, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(170,180,200,0.25)';
      g.beginPath(); g.ellipse(-h * 0.1, h * 0.95, h * 0.5, h * 0.1, 0, 0, Math.PI * 2); g.fill();
      if (open < 0.6) { g.fillStyle = `rgba(170,214,170,${(0.6 - open) * 0.9})`; g.fillRect(-h, -h, h * 2, h * 3); }
      g.restore();
      g.filter = 'none';
      g.strokeStyle = 'rgba(140,175,150,0.6)'; g.lineWidth = 2.2; bellPath(g, h, open); g.stroke();
      g.translate(1.5, 1);
      g.strokeStyle = 'rgba(118,92,116,0.75)'; g.lineWidth = 1.8; bellPath(g, h, open); g.stroke();
      g.translate(-1.5, -1);
      g.strokeStyle = 'rgba(150,170,155,0.4)'; g.lineWidth = 1.4;
      g.beginPath();
      g.moveTo(h * 0.06, h * 0.1); g.quadraticCurveTo(h * 0.2, h * 0.5, h * 0.15, h * 0.9);
      g.moveTo(-h * 0.08, h * 0.1); g.quadraticCurveTo(-h * 0.22, h * 0.5, -h * 0.17, h * 0.9);
      g.stroke();
      g.fillStyle = 'rgba(60,140,84,0.9)';
      g.beginPath(); g.ellipse(0, h * 0.03, h * 0.09, h * 0.06, 0, 0, Math.PI * 2); g.fill();
      BELLS.push({ cnv, ox: h * 0.9, oy: h * 0.12 });
    }
  }

  // ---------- soft wash behind the plants
  let WASH = null;
  function paintWash() {
    WASH = off(W, H);
    const g = WASH.getContext('2d');
    g.filter = 'blur(50px)';
    const blobs = [
      [120, H - 260, 260, 'rgba(120,190,150,0.20)'], [960, H - 300, 260, 'rgba(120,190,150,0.20)'],
      [540, H - 160, 320, 'rgba(150,200,205,0.16)'], [330, H - 360, 200, 'rgba(160,205,175,0.14)'],
      [760, H - 380, 200, 'rgba(160,205,175,0.14)'], [540, H - 30, 420, 'rgba(110,180,140,0.16)'],
    ];
    blobs.forEach(([x, y, r, col]) => { g.fillStyle = col; g.beginPath(); g.ellipse(x, y, r * SC, r * 0.8 * SC, 0, 0, Math.PI * 2); g.fill(); });
  }

  // ---------- the plants: clumps along the bottom edge, taller at the sides
  const leaves = [], stems = [];
  const GROW = 3.0;
  function build(fmt) {
    seed = 5;
    leaves.length = 0; stems.length = 0;
    H = fmt === 'post' ? 1350 : 1920;
    SC = fmt === 'post' ? 0.78 : 1;
    cv.height = H;
    cv.style.width = `min(100%, calc((100vh - 96px) * ${W / H}))`;
    const clumps = [
      { x: 70, h: 1.0, lean: -1 }, { x: 290, h: 0.7, lean: -1 }, { x: 540, h: 0.5, lean: 1 },
      { x: 790, h: 0.7, lean: 1 }, { x: 1010, h: 1.0, lean: 1 },
    ];
    clumps.forEach((cl, ci) => {
      const by = H + 40, d0 = 0.2 + Math.abs(ci - 2) * 0.35;
      const nl = 2;
      for (let k = 0; k < nl; k++) {
        const L = (230 + 250 * cl.h + rnd() * 90 - k * 60) * SC;
        const w = (100 + rnd() * 34) * SC;
        const curl = (rnd() - 0.5) * 0.12;
        const spread = (k - (nl - 1) / 2) * 0.5;
        leaves.push({
          x: cl.x + (rnd() - 0.5) * 40, y: by,
          a: -Math.PI / 2 + spread + cl.lean * 0.08 + (rnd() - 0.5) * 0.12,
          d: d0 + k * 0.25, phase: rnd() * 6.28, front: k === nl - 1,
          sprite: paintLeaf(L, w, curl, k % 2),
        });
      }
      const ns = cl.h > 0.6 ? 2 : 1;
      for (let k = 0; k < ns; k++) {
        const dir = ns === 1 ? (rnd() < 0.5 ? -1 : 1) : (k ? 1 : -1) * (ci < 2 ? -1 : 1);
        const bells = 9 + Math.floor(rnd() * 4);
        const s = {
          x: cl.x + (rnd() - 0.5) * 30, y: by,
          a: -Math.PI / 2 + dir * (0.04 + rnd() * 0.1),
          bend: dir * (1.15 + rnd() * 0.35),
          L: (420 + 330 * cl.h + rnd() * 80) * SC,
          bells, d: d0 + 0.6 + k * 0.4, phase: rnd() * 6.28, sizes: [],
        };
        for (let i = 0; i < bells; i++) s.sizes.push(0.9 + rnd() * 0.2);
        stems.push(s);
      }
    });
    paintBells();
    paintWash();
    document.querySelectorAll('[data-fmt]').forEach(b => b.setAttribute('aria-pressed', b.dataset.fmt === fmt));
  }

  function drawLeaf(l, t) {
    const g0 = (t - l.d) / 2.0;
    if (g0 <= 0) return;
    const g = easeOut(g0);
    const sway = Math.sin(t * 0.7 + l.phase) * 0.012 * clamp(g0 - 1);
    ctx.save();
    ctx.globalAlpha = clamp(g0 * 2.5);
    ctx.translate(l.x, l.y);
    ctx.rotate(l.a + sway);
    ctx.scale(g, Math.pow(g, 0.6));
    ctx.drawImage(l.sprite.cnv, -l.sprite.ox, -l.sprite.oy);
    ctx.restore();
  }

  function stemPoints(s, t) {
    const N = 70, pts = [];
    const sway = Math.sin(t * 0.8 + s.phase) * 0.05 * clamp((t - s.d - GROW) / 1.5);
    let x = s.x, y = s.y;
    pts.push({ x, y, a: s.a });
    for (let i = 1; i <= N; i++) {
      const u = i / N;
      const a = s.a + (s.bend + sway) * Math.pow(u, 2.6);
      x += Math.cos(a) * s.L / N; y += Math.sin(a) * s.L / N;
      pts.push({ x, y, a });
    }
    return pts;
  }

  function drawStem(pts, prog) {
    const n = Math.max(1, Math.floor(prog * (pts.length - 1)));
    ctx.lineCap = 'round';
    for (const [col, k, dx] of [[C.stemDeep, 1, 0], [C.stem, 0.6, -0.8], [C.pencil, 0.22, 1.6]]) {
      ctx.strokeStyle = col;
      for (let i = 0; i < n; i++) {
        const u = i / (pts.length - 1);
        ctx.lineWidth = (6 - 3.8 * u) * k * SC + (k < 0.3 ? 0.6 : 0);
        ctx.beginPath();
        ctx.moveTo(pts[i].x + dx, pts[i].y);
        ctx.lineTo(pts[i + 1].x + dx, pts[i + 1].y);
        ctx.stroke();
      }
    }
  }

  function drawBells(s, pts, t, prog) {
    const n = s.bells;
    for (let i = 0; i < n; i++) {
      const fr = 0.6 + 0.38 * (i / (n - 1));
      if (prog < fr) continue;
      const born = s.d + GROW * fr + 0.05;
      const bud = easeOut((t - born) / 0.7);
      if (bud <= 0) continue;
      const tipRank = n - 1 - i;
      const maxOpen = tipRank === 0 ? 0 : tipRank === 1 ? 0.3 : 1;
      const open = maxOpen * ease((t - born - 0.5) / 1.2);
      const size = (46 - 22 * (i / (n - 1))) * s.sizes[i] * SC;

      const p = pts[Math.round(fr * (pts.length - 1))];
      let nx = -Math.sin(p.a), ny = Math.cos(p.a);
      if (ny < 0 || (Math.abs(ny) < 0.25 && nx * Math.sign(s.bend) < 0)) { nx = -nx; ny = -ny; }
      const swing = Math.sin(t * 1.3 + s.phase + i * 0.7) * 0.07;
      const ax = Math.sin(swing) + nx * 0.15, ay = Math.cos(swing);
      const al = Math.hypot(ax, ay);
      const pl = (14 + size * 0.5) * back(bud);
      const p1x = p.x + nx * pl * 0.75, p1y = p.y + ny * pl * 0.75;
      const p2x = p1x + ax / al * pl * 0.55, p2y = p1y + ay / al * pl * 0.55;

      ctx.strokeStyle = C.stem; ctx.lineWidth = 1.6 * SC;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.quadraticCurveTo(p1x, p1y, p2x, p2y); ctx.stroke();

      const grow = 0.55 + 0.45 * Math.max(open, tipRank > 1 ? bud * 0.3 : 0);
      const k = size * grow * back(bud) / BELL;
      const sp = BELLS[Math.round(open * 10)];
      ctx.save();
      ctx.translate(p2x, p2y);
      ctx.rotate(Math.atan2(ay, ax) - Math.PI / 2);
      ctx.scale(k, k);
      ctx.drawImage(sp.cnv, -sp.ox, -sp.oy);
      ctx.restore();
    }
  }

  function drawQuote(t) {
    if (!showText) return;
    const fs = 64 * SC, lh = 112 * SC;
    const top = H * 0.4 - lh * 1.5;
    ctx.save();
    ctx.font = `${fs}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    try { ctx.letterSpacing = `${4 * SC}px`; } catch (e) {}
    ctx.fillStyle = C.ink;
    QUOTE.forEach((line, i) => {
      const a = ease((t - 0.6 - i * 0.55) / 1.3);
      if (a <= 0) return;
      ctx.globalAlpha = a;
      const dx = i === 3 ? 40 * SC : 0;            // signature sits a little to the right, as in the design
      ctx.fillText(line, W / 2 + dx, top + i * lh + (1 - a) * 14);
    });
    ctx.restore();
  }

  function renderAt(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = ease(t / 2.5);
    ctx.drawImage(WASH, 0, 0);
    ctx.globalAlpha = 1;
    leaves.filter(l => !l.front).forEach(l => drawLeaf(l, t));
    stems.forEach(s => {
      s._prog = ease((t - s.d) / GROW);
      if (s._prog <= 0) return;
      s._pts = stemPoints(s, t);
      drawStem(s._pts, s._prog);
    });
    leaves.filter(l => l.front).forEach(l => drawLeaf(l, t));
    stems.forEach(s => { if (s._prog > 0) drawBells(s, s._pts, t, s._prog); });
    drawQuote(t);
  }
  window.renderAt = renderAt;

  const params = new URLSearchParams(location.search);
  const fontReady = Promise.race([
    document.fonts.load(`64px "Gloria Hallelujah"`).catch(() => {}),
    new Promise(r => setTimeout(r, 2500)),
  ]);
  if (params.get('text') === 'off') showText = false;
  build(params.get('format') === 'post' ? 'post' : 'reel');
  renderAt(0);

  if (params.has('export')) {
    document.body.classList.add('export');
    window.ready = fontReady.then(() => true);
    return;
  }

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let start = performance.now();
  function loop(now) { renderAt((now - start) / 1000); requestAnimationFrame(loop); }
  fontReady.then(() => {
    start = performance.now();
    if (reduce) renderAt(10); else requestAnimationFrame(loop);
  });
  const again = () => { start = performance.now(); if (reduce) renderAt(10); };
  document.getElementById('replay').addEventListener('click', again);
  document.getElementById('text').addEventListener('click', e => {
    showText = !showText;
    e.currentTarget.setAttribute('aria-pressed', showText);
    if (reduce) renderAt(10);
  });
  document.querySelectorAll('[data-fmt]').forEach(b => b.addEventListener('click', () => { build(b.dataset.fmt); again(); }));
})();
</script>
